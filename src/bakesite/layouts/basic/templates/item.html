
<article>
  <h2><a href="{{ base_path }}/{{ blog }}/{{ slug }}/">{{ title }}</a></h2>
  <p class="meta">Published on {{ date }} by <b>{{ author }}</b></p>
  <p class="summary">
    {{ summary }}&nbsp;<a
      class="more"
      href="{{ base_path }}/{{ blog }}/{{ slug }}/"
      >...</a
    >
  </p>
  <div>
    <a class="more" href="{{ base_path }}/{{ blog }}/{{ slug }}/">Read More</a>
  </div>
  {% if tags %}
  <div class="tags">
    {% for tag in tags %}
    <a href="{{ base_path }}/{{ blog }}/tag/{{ tag }}/" class="tag">{{ tag }}</a>
    {% endfor %}
  </div>
  {% endif %}
</article>
